name: swavina
description: Swavina - Smart Warm Vibration Activation. Aplikasi terapi hangat & getar berbasis ESP32 untuk pasien DM tipe 2.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_blue_plus: ^1.35.5
  sqflite: ^2.4.1
  path: ^1.9.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  multicast_dns: ^0.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
